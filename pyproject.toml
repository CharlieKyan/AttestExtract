[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niceextract"
version = "0.1.0a1"
description = "Extract observations from research text and tables into JSON with source-linked evidence."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CharlieKyan"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "certifi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
niceextract = "niceextract.cli:main"

[project.urls]
Homepage = "https://github.com/CharlieKyan/NiceExtract"
Repository = "https://github.com/CharlieKyan/NiceExtract"
Issues = "https://github.com/CharlieKyan/NiceExtract/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
niceextract = ["examples/*.json", "examples/*.txt", "examples/*.md", "examples/d1/*/*.json", "examples/d1/*/*.txt", "examples/table_routes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

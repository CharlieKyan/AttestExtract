name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest
      - name: Build distribution
        run: python -m build
      - name: Install wheel and run demos and D1 archives outside the checkout
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import tomllib
          import venv

          expected_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          wheel = next(Path("dist").glob(f"niceextract-{expected_version}-*.whl")).resolve()
          acceptance_script = Path("scripts/d2_acceptance.py").resolve()
          selection_script = Path("scripts/model_selection_smoke.py").resolve()
          minimal_script = Path("scripts/minimal_api_smoke.py").resolve()
          execution_script = Path("scripts/execution_smoke.py").resolve()
          format_script = Path("scripts/format_recovery_smoke.py").resolve()
          structured_script = Path("scripts/structured_output_smoke.py").resolve()
          protocol_script = Path("scripts/protocol_evidence_smoke.py").resolve()
          decision_script = Path("scripts/decision_bundle_smoke.py").resolve()
          d4_script = Path("scripts/d4_evidence_smoke.py").resolve()
          transport_script = Path("scripts/transport_recovery_smoke.py").resolve()
          source_archive = Path("dist", f"niceextract-{expected_version}.tar.gz").resolve()
          provider_names = (
              "provider_experiment.py", "provider_experiment_bundle.py",
              "provider_experiment_runner.py", "provider_experiment_reporting.py",
              "provider_experiment_smoke.py",
              "provider_experiment_review.py", "provider_experiment_compat.py",
              "provider_review_smoke.py",
          )
          provider_sources = {}
          table_names = ("table_route_experiment.py", "table_route_runner.py", "table_results_smoke.py",
                         "table_entry_smoke.py", "simple_task_smoke.py", "user_entry_smoke.py",
                         "table_window_smoke.py", "analysis_smoke.py", "verification_recovery_smoke.py")
          table_sources = {}
          tls_sources = {}
          with tarfile.open(source_archive) as archive:
              for name in provider_names:
                  members = [member for member in archive.getmembers()
                             if member.name.endswith("/scripts/" + name) and member.isfile()]
                  assert len(members) == 1, f"Source distribution must contain {name}"
                  provider_sources[name] = archive.extractfile(members[0]).read()
                  assert provider_sources[name] == Path("scripts", name).read_bytes()
              for name in table_names:
                  members = [member for member in archive.getmembers()
                             if member.name.endswith("/scripts/" + name) and member.isfile()]
                  assert len(members) == 1, f"Source distribution must contain {name}"
                  table_sources[name] = archive.extractfile(members[0]).read()
                  assert table_sources[name] == Path("scripts", name).read_bytes()
              for relative in ("scripts/tls_first_smoke.py",
                               "tests/fixtures/tls_local/localhost-cert.pem",
                               "tests/fixtures/tls_local/localhost-key.pem"):
                  members = [member for member in archive.getmembers()
                             if member.name.endswith("/" + relative) and member.isfile()]
                  assert len(members) == 1, f"Source distribution must contain {relative}"
                  tls_sources[relative] = archive.extractfile(members[0]).read()
                  assert tls_sources[relative] == Path(relative).read_bytes()
          with tempfile.TemporaryDirectory(prefix="niceextract-smoke-") as directory:
              root = Path(directory).resolve(strict=True)
              environment = root / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              env = dict(os.environ)
              env.pop("PYTHONPATH", None)
              env.pop("PYTHONHOME", None)
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True, cwd=root, env=env)
              def assert_installed_module(summary):
                  module_path = Path(summary["module_path"]).resolve(strict=True)
                  assert module_path.is_relative_to(environment), (module_path, environment)

              output = root / "results.json"
              cli = python.with_name("niceextract.exe" if os.name == "nt" else "niceextract")
              installed_version = subprocess.check_output([str(cli), "--version"], cwd=root, env=env, text=True)
              assert installed_version.strip() == expected_version
              subprocess.run([str(cli), "demo", "--output", str(output)], check=True, cwd=root, env=env)
              examples = json.loads(output.read_text(encoding="utf-8"))["examples"]
              assert set(examples) == {"ccus", "procurement"}
              for name, count in (("ccus", 2), ("procurement", 3)):
                  result = examples[name]
                  assert result["package_version"] == expected_version
                  assert result["run"]["mode"] == "replay"
                  assert len(result["candidates"]) == count
                  assert result["review"] == []
              d1_output = root / "d1-results.json"
              subprocess.run([str(python), "-m", "niceextract", "d1", "--output", str(d1_output)], check=True, cwd=root, env=env)
              archives = json.loads(d1_output.read_text(encoding="utf-8"))["examples"]
              assert set(archives) == {"attribute", "observation", "relation"}
              for name, candidate_count, record_count in (("attribute", 2, 1), ("observation", 2, 2), ("relation", 1, 1)):
                  archive = archives[name]
                  assert archive["extraction"]["package_version"] == expected_version
                  assert archive["extraction"]["run"]["mode"] == "replay"
                  assert len(archive["extraction"]["candidates"]) == candidate_count
                  assert len(archive["records"]) == record_count
                  assert all(review["origin"] == "synthetic_fixture" for review in archive["reviews"])
              # Copy the runner outside the checkout; imports must use the installed wheel.
              scripts = root / "runner" / "scripts"
              scripts.mkdir(parents=True)
              copied = scripts / "d2_acceptance.py"
              shutil.copyfile(acceptance_script, copied)
              acceptance = root / "d2-mock"
              subprocess.run([str(python), str(copied), "--mode", "mock", "--output-dir", str(acceptance)],
                             check=True, cwd=root, env=env)
              summary = json.loads((acceptance / "summary.json").read_text(encoding="utf-8"))
              assert summary["package_version"] == expected_version
              assert summary["passed"] and summary["real_endpoint_calls"] == 0
              assert summary["mock_http_calls"] == 3
              assert [case["candidate_count"] for case in summary["cases"]] == [1, 2, 1]
              minimal_copy = scripts / "minimal_api_smoke.py"
              shutil.copyfile(minimal_script, minimal_copy)
              minimal_output = root / "minimal-api"
              subprocess.run([str(python), str(minimal_copy), "--output-dir", str(minimal_output)],
                             check=True, cwd=root, env=env)
              minimal = json.loads((minimal_output / "summary.json").read_text(encoding="utf-8"))
              assert minimal["passed"] and minimal["real_endpoint_calls"] == 0
              assert minimal["mock_model_posts"] == 15
              assert_installed_module(minimal)
              selection_copy = scripts / "model_selection_smoke.py"
              shutil.copyfile(selection_script, selection_copy)
              selection_output = root / "model-selection"
              subprocess.run([str(python), str(selection_copy), "--output-dir", str(selection_output)],
                             check=True, cwd=root, env=env)
              selection = json.loads((selection_output / "summary.json").read_text(encoding="utf-8"))
              assert selection["passed"] and selection["real_endpoint_calls"] == 0
              assert selection["mock_http_calls"] == 7
              assert_installed_module(selection)
              execution_copy = scripts / "execution_smoke.py"
              shutil.copyfile(execution_script, execution_copy)
              execution_output = root / "execution"
              subprocess.run([str(python), str(execution_copy), "--output-dir", str(execution_output)],
                             check=True, cwd=root, env=env)
              execution = json.loads((execution_output / "summary.json").read_text(encoding="utf-8"))
              assert execution["passed"] and execution["real_endpoint_calls"] == 0
              assert execution["mock_http_calls"] == 4 and execution["completed_resume_new_calls"] == 0
              assert_installed_module(execution)
              format_copy = scripts / "format_recovery_smoke.py"
              shutil.copyfile(format_script, format_copy)
              format_output = root / "format-recovery"
              subprocess.run([str(python), str(format_copy), "--output-dir", str(format_output)],
                             check=True, cwd=root, env=env)
              recovery = json.loads((format_output / "summary.json").read_text(encoding="utf-8"))
              assert recovery["passed"] and recovery["real_endpoint_calls"] == 0
              assert recovery["mock_http_calls"] == 17 and recovery["exhausted"]["resume_new_calls"] == 0
              assert set(recovery["legacy_entry_cases"]) == {"python", "cli"}
              for case in recovery["legacy_entry_cases"].values():
                  assert case["reused_chunks"] == 3 and case["resume_new_calls"] == 1
                  assert case["completed_resume_new_calls"] == case["exhausted_resume_new_calls"] == 0
                  assert case["legacy_feedback_removed_from_prompt"] and case["previous_runs_unchanged"]
              assert_installed_module(recovery)
              structured_copy = scripts / "structured_output_smoke.py"
              shutil.copyfile(structured_script, structured_copy)
              structured_output = root / "structured-output"
              subprocess.run([str(python), str(structured_copy), "--output-dir", str(structured_output)],
                             check=True, cwd=root, env=env)
              structured = json.loads((structured_output / "summary.json").read_text(encoding="utf-8"))
              assert structured["passed"] and structured["real_endpoint_calls"] == 0
              assert structured["mock_http_calls"] == 4 and structured["completed_resume_new_calls"] == 0
              assert_installed_module(structured)
              protocol_copy = scripts / "protocol_evidence_smoke.py"
              shutil.copyfile(protocol_script, protocol_copy)
              protocol_output = root / "protocol-evidence"
              subprocess.run([str(python), str(protocol_copy), "--output-dir", str(protocol_output)],
                             check=True, cwd=root, env=env)
              protocol = json.loads((protocol_output / "summary.json").read_text(encoding="utf-8"))
              assert protocol["passed"] and protocol["real_endpoint_calls"] == 0
              assert_installed_module(protocol)
              decision_copy = scripts / "decision_bundle_smoke.py"
              shutil.copyfile(decision_script, decision_copy)
              decision_output = root / "decisions"
              subprocess.run([str(python), str(decision_copy), "--output-dir", str(decision_output)],
                             check=True, cwd=root, env=env)
              decision = json.loads((decision_output / "summary.json").read_text(encoding="utf-8"))
              assert decision["passed"] and decision["real_endpoint_calls"] == 0
              assert decision["decision_model_calls"] == 0 and decision["created_final_records"] == 0
              assert_installed_module(decision)
              d4_copy = scripts / "d4_evidence_smoke.py"
              shutil.copyfile(d4_script, d4_copy)
              d4_output = root / "d4-evidence"
              subprocess.run([str(python), str(d4_copy), "--output-dir", str(d4_output)],
                             check=True, cwd=root, env=env)
              d4 = json.loads((d4_output / "summary.json").read_text(encoding="utf-8"))
              assert d4["passed"] and d4["real_endpoint_calls"] == 0
              assert_installed_module(d4)
              transport_copy = scripts / "transport_recovery_smoke.py"
              shutil.copyfile(transport_script, transport_copy)
              transport_output = root / "transport-recovery"
              subprocess.run([str(python), str(transport_copy), "--output-dir", str(transport_output)],
                             check=True, cwd=root, env=env)
              transport = json.loads((transport_output / "summary.json").read_text(encoding="utf-8"))
              assert transport["passed"] and transport["real_endpoint_calls"] == 0
              assert transport["mock_http_calls"] == 17 and transport["resume_new_calls"] == 5
              assert_installed_module(transport)
              for relative, content in tls_sources.items():
                  target = root / "runner" / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
              tls_output = root / "tls-first"
              subprocess.run([str(python), str(scripts / "tls_first_smoke.py"),
                              "--certificate-dir", str(root / "runner/tests/fixtures/tls_local"),
                              "--output-dir", str(tls_output)], check=True, cwd=root, env=env)
              tls = json.loads((tls_output / "summary.json").read_text(encoding="utf-8"))
              assert tls["passed"] and tls["real_endpoint_calls"] == 0 and tls["loopback_only"]
              assert tls["package_version"] == expected_version
              assert tls["local_model_posts"] == 4 and tls["probe_attempts"] == 4
              assert tls["environment_restored"]
              assert_installed_module(tls)
              assert [case.get("actual_tls_version") for case in tls["cases"][:2]] == ["TLSv1.2", "TLSv1.3"]
              assert tls["cases"][2]["model_posts"] == 0 and not tls["cases"][2]["fallback"]
              for name, content in provider_sources.items():
                  (scripts / name).write_bytes(content)
              provider_output = root / "provider-experiment"
              subprocess.run([str(python), str(scripts / "provider_experiment_smoke.py"),
                              "--output-dir", str(provider_output)], check=True, cwd=root, env=env)
              providers = json.loads((provider_output / "summary.json").read_text(encoding="utf-8"))
              assert providers["passed"] and providers["real_endpoint_calls"] == 0
              assert providers["mock_network_calls"] == 108
              assert_installed_module(providers)
              reviewed_output = root / "provider-review"
              subprocess.run([str(python), str(scripts / "provider_review_smoke.py"),
                              "--output-dir", str(reviewed_output)], check=True, cwd=root, env=env)
              reviewed = json.loads((reviewed_output / "summary.json").read_text(encoding="utf-8"))
              assert reviewed["passed"] and reviewed["real_endpoint_calls"] == 0
              assert reviewed["D_new_calls"] == 32 and reviewed["repeat_D_new_calls"] == 0
              assert reviewed["attach_review_new_calls"] == 0
              assert reviewed["historical_artifacts_unchanged"] and reviewed["strict_scores_preserved"]
              assert_installed_module(reviewed)
              for name, content in table_sources.items():
                  (scripts / name).write_bytes(content)
              table_output = root / "table-results"
              subprocess.run([str(python), str(scripts / "table_results_smoke.py"),
                              "--output-dir", str(table_output)], check=True, cwd=root, env=env)
              tables = json.loads((table_output / "summary.json").read_text(encoding="utf-8"))
              assert tables["passed"] and tables["real_model_calls"] == 0
              assert tables["network_attempts"] == 0 and tables["planned_slots"] == 12
              assert tables["completed_resume_new_calls"] == 0
              assert tables["package_version"] == expected_version
              assert_installed_module(tables)
              entry_output = root / "table-entry"
              subprocess.run([str(python), str(scripts / "table_entry_smoke.py"),
                              "--output-dir", str(entry_output)], check=True, cwd=root, env=env)
              entry = json.loads((entry_output / "summary.json").read_text(encoding="utf-8"))
              assert entry["passed"] and entry["real_model_calls"] == entry["network_attempts"] == 0
              assert entry["record_count"] == 3 and entry["isolated_records"] == 1
              assert entry["resume_new_calls"] == 2 and entry["completed_resume_new_calls"] == 0
              assert entry["cli_exit_status"] == 2 and entry["historical_artifacts_unchanged"]
              assert entry["package_version"] == expected_version
              assert_installed_module(entry)
              simple_output = root / "simple-task"
              subprocess.run([str(python), str(scripts / "simple_task_smoke.py"),
                              "--output-dir", str(simple_output)], check=True, cwd=root, env=env)
              simple = json.loads((simple_output / "summary.json").read_text(encoding="utf-8"))
              assert simple["passed"] and simple["real_model_calls"] == simple["network_attempts"] == 0
              assert simple["target_count"] == 3 and simple["example_target_count"] == 1
              assert simple["prose_records"] == 2 and simple["table_records"] == 1
              assert simple["completed_resume_new_calls"] == simple["cli_check_synthetic_calls"] == 0
              assert simple["cli_exit_status"] == 0 and simple["synthetic_backend_generate_calls"] == 4
              assert simple["historical_artifacts_unchanged"] and simple["report_includes_unobserved_target"]
              assert simple["package_version"] == entry["package_version"]
              assert_installed_module(simple)
              user_output = root / "user-entry"
              subprocess.run([str(python), str(scripts / "user_entry_smoke.py"),
                              "--output-dir", str(user_output)], check=True, cwd=root, env=env)
              user = json.loads((user_output / "summary.json").read_text(encoding="utf-8"))
              assert user["passed"] and user["mock_model_posts"] == 6
              assert user["mock_planning_posts"] == user["mock_extraction_posts"] == 3
              assert user["real_model_calls"] == user["network_attempts"] == 0
              assert user["completed_resume_new_calls"] == 0 and user["failure_checkpoint_saved"]
              assert user["python_cli_candidates_equal"] and user["historical_artifacts_unchanged"]
              assert user["package_version"] == expected_version
              assert_installed_module(user)
              window_output = root / "table-windows"
              subprocess.run([str(python), str(scripts / "table_window_smoke.py"),
                              "--output-dir", str(window_output)], check=True, cwd=root, env=env)
              windows = json.loads((window_output / "summary.json").read_text(encoding="utf-8"))
              assert windows["passed"] and windows["real_model_calls"] == windows["network_attempts"] == 0
              assert windows["model_call_ledger"] == 3 and windows["table_windows"] == 2
              assert windows["retained_observations"] == 4 and windows["resume_new_calls"] == 1
              assert windows["completed_replay_new_calls"] == 0 and windows["historical_artifacts_unchanged"]
              assert windows["child_scoped_annotation_ids_unique"] and windows["cli_offline_check_exit_status"] == 0
              assert windows["package_version"] == expected_version
              assert_installed_module(windows)
              recovery_output = root / "verification-recovery"
              subprocess.run([str(python), str(scripts / "verification_recovery_smoke.py"),
                              "--output-dir", str(recovery_output)], check=True, cwd=root, env=env)
              recovery = json.loads((recovery_output / "summary.json").read_text(encoding="utf-8"))
              assert recovery["passed"] and recovery["real_model_calls"] == recovery["network_attempts"] == 0
              assert recovery["mock_http_calls"] == 14
              assert recovery["package_version"] == expected_version
              assert_installed_module(recovery)
              analysis_output = root / "bounded-analysis"
              subprocess.run([str(python), str(scripts / "analysis_smoke.py"),
                              "--output", str(analysis_output)], check=True, cwd=root, env=env)
              analysis = json.loads((analysis_output / "summary.json").read_text(encoding="utf-8"))
              assert analysis["passed"] and analysis["real_model_calls"] == analysis["network_attempts"] == 0
              assert set(analysis["modes"]) == {"json_schema", "json_object"}
              for mode, checks in analysis["modes"].items():
                  assert checks["analysis_calls"] == checks["cli_analysis_calls"] == 3
                  assert checks["resume_new_calls"] == checks["cli_resume_new_calls"] == 0
                  assert checks["analysis_budget_reserved"] == checks["analysis_budget_limit"] == 3
                  assert checks["cli_check_new_calls"] == checks["cli_exit_status"] == 0
                  assert checks["credential_isolation"]
                  assert set(checks["scope_acceptance"]) == {"python", "cli"}
                  for scope in checks["scope_acceptance"].values():
                      assert scope["passed"] and scope["observations"] == 18
                      assert scope["targets_per_job"] == 6 and scope["readonly_references_per_job"] == 12
                      assert scope["supported"] == 15 and scope["unknown"] == 3
                      assert scope["analysis_calls"] == 5 and scope["resume_new_calls"] == 0
                      assert scope["cross_paragraph_evidence"]
                  assert set(checks["ambiguity_acceptance"]) == {"python", "cli"}
                  for entry_name, review in checks["ambiguity_acceptance"].items():
                      assert review["passed"] and review["observations"] == 12
                      assert review["review_groups"] == 1 and review["review_observations"] == 1
                      assert review["supported_observations"] == 11 and review["analysis_status"] == "partial"
                      assert review["analysis_calls"] == 2 and review["resume_new_calls"] == 0
                      assert review["known_objects_unpolluted"] and review["original_response_preserved"]
                      if entry_name == "cli":
                          assert review["cli_exit_status"] == 3
                  assert set(checks["partial_acceptance"]) == {"python", "cli"}
                  for entry_name, partial in checks["partial_acceptance"].items():
                      assert partial["passed"] and partial["observations"] == 12
                      assert partial["supported_observations"] == 9 and partial["unknown_observations"] == 1
                      assert partial["first_group_applied"] == 4 and partial["first_group_held"] == 2
                      assert partial["analysis_calls"] == 2 and partial["resume_new_calls"] == 0
                      assert partial["original_response_preserved"] and partial["independent_proposals_retained"]
                      if entry_name == "cli":
                          assert partial["cli_exit_status"] == 3
              assert analysis["modes"]["json_object"]["json_object_prompt_gate"]
              assert analysis["package_version"] == expected_version
              assert_installed_module(analysis)

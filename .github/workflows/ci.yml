name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest
      - name: Build distribution
        run: python -m build
      - name: Install wheel and run demos and D1 archives outside the checkout
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import venv

          wheel = next(Path("dist").glob("attestextract-*.whl")).resolve()
          acceptance_script = Path("scripts/d2_acceptance.py").resolve()
          selection_script = Path("scripts/model_selection_smoke.py").resolve()
          execution_script = Path("scripts/execution_smoke.py").resolve()
          format_script = Path("scripts/format_recovery_smoke.py").resolve()
          structured_script = Path("scripts/structured_output_smoke.py").resolve()
          protocol_script = Path("scripts/protocol_evidence_smoke.py").resolve()
          decision_script = Path("scripts/decision_bundle_smoke.py").resolve()
          with tempfile.TemporaryDirectory(prefix="attestextract-smoke-") as directory:
              root = Path(directory)
              environment = root / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              env = dict(os.environ)
              env.pop("PYTHONPATH", None)
              env.pop("PYTHONHOME", None)
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True, cwd=root, env=env)
              output = root / "results.json"
              subprocess.run([str(python), "-m", "attestextract", "demo", "--output", str(output)], check=True, cwd=root, env=env)
              examples = json.loads(output.read_text(encoding="utf-8"))["examples"]
              assert set(examples) == {"ccus", "procurement"}
              for name, count in (("ccus", 2), ("procurement", 3)):
                  result = examples[name]
                  assert result["package_version"] == "0.1.0.dev18"
                  assert result["run"]["mode"] == "replay"
                  assert len(result["candidates"]) == count
                  assert result["review"] == []
              d1_output = root / "d1-results.json"
              subprocess.run([str(python), "-m", "attestextract", "d1", "--output", str(d1_output)], check=True, cwd=root, env=env)
              archives = json.loads(d1_output.read_text(encoding="utf-8"))["examples"]
              assert set(archives) == {"attribute", "observation", "relation"}
              for name, candidate_count, record_count in (("attribute", 2, 1), ("observation", 2, 2), ("relation", 1, 1)):
                  archive = archives[name]
                  assert archive["extraction"]["package_version"] == "0.1.0.dev18"
                  assert archive["extraction"]["run"]["mode"] == "replay"
                  assert len(archive["extraction"]["candidates"]) == candidate_count
                  assert len(archive["records"]) == record_count
                  assert all(review["origin"] == "synthetic_fixture" for review in archive["reviews"])
              # Copy the runner outside the checkout; imports must use the installed wheel.
              scripts = root / "runner" / "scripts"
              scripts.mkdir(parents=True)
              copied = scripts / "d2_acceptance.py"
              shutil.copyfile(acceptance_script, copied)
              acceptance = root / "d2-mock"
              subprocess.run([str(python), str(copied), "--mode", "mock", "--output-dir", str(acceptance)],
                             check=True, cwd=root, env=env)
              summary = json.loads((acceptance / "summary.json").read_text(encoding="utf-8"))
              assert summary["package_version"] == "0.1.0.dev18"
              assert summary["passed"] and summary["real_endpoint_calls"] == 0
              assert summary["mock_http_calls"] == 3
              assert [case["candidate_count"] for case in summary["cases"]] == [1, 2, 1]
              selection_copy = scripts / "model_selection_smoke.py"
              shutil.copyfile(selection_script, selection_copy)
              selection_output = root / "model-selection"
              subprocess.run([str(python), str(selection_copy), "--output-dir", str(selection_output)],
                             check=True, cwd=root, env=env)
              selection = json.loads((selection_output / "summary.json").read_text(encoding="utf-8"))
              assert selection["passed"] and selection["real_endpoint_calls"] == 0
              assert selection["mock_http_calls"] == 7
              assert Path(selection["module_path"]).is_relative_to(environment)
              execution_copy = scripts / "execution_smoke.py"
              shutil.copyfile(execution_script, execution_copy)
              execution_output = root / "execution"
              subprocess.run([str(python), str(execution_copy), "--output-dir", str(execution_output)],
                             check=True, cwd=root, env=env)
              execution = json.loads((execution_output / "summary.json").read_text(encoding="utf-8"))
              assert execution["passed"] and execution["real_endpoint_calls"] == 0
              assert execution["mock_http_calls"] == 4 and execution["completed_resume_new_calls"] == 0
              assert Path(execution["module_path"]).is_relative_to(environment)
              format_copy = scripts / "format_recovery_smoke.py"
              shutil.copyfile(format_script, format_copy)
              format_output = root / "format-recovery"
              subprocess.run([str(python), str(format_copy), "--output-dir", str(format_output)],
                             check=True, cwd=root, env=env)
              recovery = json.loads((format_output / "summary.json").read_text(encoding="utf-8"))
              assert recovery["passed"] and recovery["real_endpoint_calls"] == 0
              assert recovery["mock_http_calls"] == 5 and recovery["exhausted"]["resume_new_calls"] == 0
              assert Path(recovery["module_path"]).is_relative_to(environment)
              structured_copy = scripts / "structured_output_smoke.py"
              shutil.copyfile(structured_script, structured_copy)
              structured_output = root / "structured-output"
              subprocess.run([str(python), str(structured_copy), "--output-dir", str(structured_output)],
                             check=True, cwd=root, env=env)
              structured = json.loads((structured_output / "summary.json").read_text(encoding="utf-8"))
              assert structured["passed"] and structured["real_endpoint_calls"] == 0
              assert structured["mock_http_calls"] == 4 and structured["completed_resume_new_calls"] == 0
              assert Path(structured["module_path"]).is_relative_to(environment)
              protocol_copy = scripts / "protocol_evidence_smoke.py"
              shutil.copyfile(protocol_script, protocol_copy)
              protocol_output = root / "protocol-evidence"
              subprocess.run([str(python), str(protocol_copy), "--output-dir", str(protocol_output)],
                             check=True, cwd=root, env=env)
              protocol = json.loads((protocol_output / "summary.json").read_text(encoding="utf-8"))
              assert protocol["passed"] and protocol["real_endpoint_calls"] == 0
              assert Path(protocol["module_path"]).is_relative_to(environment)
              decision_copy = scripts / "decision_bundle_smoke.py"
              shutil.copyfile(decision_script, decision_copy)
              decision_output = root / "decisions"
              subprocess.run([str(python), str(decision_copy), "--output-dir", str(decision_output)],
                             check=True, cwd=root, env=env)
              decision = json.loads((decision_output / "summary.json").read_text(encoding="utf-8"))
              assert decision["passed"] and decision["real_endpoint_calls"] == 0
              assert decision["decision_model_calls"] == 0 and decision["created_final_records"] == 0
              assert Path(decision["module_path"]).is_relative_to(environment)

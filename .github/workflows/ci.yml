name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest
      - name: Build distribution
        run: python -m build
      - name: Install wheel and run demos and D1 archives outside the checkout
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import venv

          wheel = next(Path("dist").glob("attestextract-*.whl")).resolve()
          acceptance_script = Path("scripts/d2_acceptance.py").resolve()
          with tempfile.TemporaryDirectory(prefix="attestextract-smoke-") as directory:
              root = Path(directory)
              environment = root / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              env = dict(os.environ)
              env.pop("PYTHONPATH", None)
              env.pop("PYTHONHOME", None)
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True, cwd=root, env=env)
              output = root / "results.json"
              subprocess.run([str(python), "-m", "attestextract", "demo", "--output", str(output)], check=True, cwd=root, env=env)
              examples = json.loads(output.read_text(encoding="utf-8"))["examples"]
              assert set(examples) == {"ccus", "procurement"}
              for name, count in (("ccus", 2), ("procurement", 3)):
                  result = examples[name]
                  assert result["package_version"] == "0.1.0.dev8"
                  assert result["run"]["mode"] == "replay"
                  assert len(result["candidates"]) == count
                  assert result["review"] == []
              d1_output = root / "d1-results.json"
              subprocess.run([str(python), "-m", "attestextract", "d1", "--output", str(d1_output)], check=True, cwd=root, env=env)
              archives = json.loads(d1_output.read_text(encoding="utf-8"))["examples"]
              assert set(archives) == {"attribute", "observation", "relation"}
              for name, candidate_count, record_count in (("attribute", 2, 1), ("observation", 2, 2), ("relation", 1, 1)):
                  archive = archives[name]
                  assert archive["extraction"]["package_version"] == "0.1.0.dev8"
                  assert archive["extraction"]["run"]["mode"] == "replay"
                  assert len(archive["extraction"]["candidates"]) == candidate_count
                  assert len(archive["records"]) == record_count
                  assert all(review["origin"] == "synthetic_fixture" for review in archive["reviews"])
              # Copy the runner outside the checkout; imports must use the installed wheel.
              scripts = root / "runner" / "scripts"
              scripts.mkdir(parents=True)
              copied = scripts / "d2_acceptance.py"
              shutil.copyfile(acceptance_script, copied)
              acceptance = root / "d2-mock"
              subprocess.run([str(python), str(copied), "--mode", "mock", "--output-dir", str(acceptance)],
                             check=True, cwd=root, env=env)
              summary = json.loads((acceptance / "summary.json").read_text(encoding="utf-8"))
              assert summary["package_version"] == "0.1.0.dev8"
              assert summary["passed"] and summary["real_endpoint_calls"] == 0
              assert summary["mock_http_calls"] == 3
              assert [case["candidate_count"] for case in summary["cases"]] == [1, 2, 1]
